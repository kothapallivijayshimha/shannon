[project]
name = "redteam-ai-api"
version = "0.1.0"
description = "Red-teaming recon automation API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "celery>=5.4",
    "redis>=5.2",
    "pyyaml>=6.0",
    "anthropic>=0.49",
    "openai>=1.55",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.28",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
